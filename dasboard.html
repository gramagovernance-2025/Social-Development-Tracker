<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Development Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.0/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Palette, type and panel styling follow the Synthesised CLF Tracker
   (3_Output/Synthesised CLF Tracker/index.html) so the trackers read as
   one family. Layout components below (glance cards, score bars, ranking
   lists, stacked bars, switchable lists) are specific to this tracker. */
:root{
  --primary:#2F9C74; --primary-soft:#E3F3EC; --gold:#CE9C3C; --gold-soft:#FAF0DC;
  --low:#C55F49; --low-soft:#FBEAE6; --ink:#1E2320; --ink-soft:#5B6660;
  --panel:#FFFFFF; --panel-alt:#F5F7F5; --grey:#B7BEB7; --grey-soft:#EFF1EE; --line:#E2E6E2; --line-strong:#D3D9D3;
  --bg:#F7F9F7;
}
*{box-sizing:border-box;}
[hidden]{ display:none !important; }
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; }
.serif{ font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; }
.container{ max-width:1180px; margin:0 auto; padding:24px 20px 80px; }
header.top{ padding:20px 0 0; }
h1{ font-size:clamp(24px,4vw,32px); margin:0 0 6px; font-weight:600; }
.hint{ font-size:12.5px; color:var(--ink-soft); }
.navbar{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; background:var(--panel); border:1px solid var(--line-strong); border-radius:14px; padding:18px; margin-top:20px; }
.navfield{ display:flex; flex-direction:column; gap:6px; min-width:200px; flex:1; }
.navfield label{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
.navfield select{ font-family:inherit; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid var(--line-strong); background:#fff; min-height:42px; }
.crumbs{ font-size:13.5px; color:var(--ink-soft); margin-top:16px; }
.crumbs b{ color:var(--ink); font-weight:600; }
.tabbar{ display:flex; gap:2px; flex-wrap:wrap; margin-top:18px; border-bottom:1px solid var(--line-strong); }
.tabbtn{ appearance:none; border:none; background:none; padding:11px 14px; font-family:inherit; font-size:14px; font-weight:600; color:var(--ink-soft); border-bottom:3px solid transparent; margin-bottom:-1px; cursor:pointer; }
.tabbtn:hover{ color:var(--ink); }
.tabbtn.active{ color:var(--primary); border-bottom-color:var(--primary); }
button:focus-visible, select:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

section{ margin-top:40px; }
.page-title{ margin-top:28px; }
.page-title h2{ font-size:24px; font-weight:600; margin:0 0 4px; }
.section-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:6px 16px; }
.section-head h2{ font-size:19px; font-weight:600; margin:0; }
.panel{ background:var(--panel); border:1px solid var(--line-strong); border-radius:14px; padding:22px; }
.subhead{ font-size:12px; font-weight:700; margin:0 0 12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
.disclaimer{ font-size:12.5px; color:var(--ink-soft); margin:12px 0 0; }
.note{ background:var(--gold-soft); border:1px solid var(--gold); border-radius:10px; padding:11px 15px; font-size:13px; color:var(--ink); margin-top:16px; }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:22px; }
.grid2 > .panel{ min-width:0; }
.card{ display:flex; flex-direction:column; }
.card .cbody{ flex:1; display:flex; flex-direction:column; justify-content:center; }
.pie{ width:100%; max-width:380px; margin:0 auto; }
.pie.wide{ max-width:460px; }
.pie-pair{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; text-align:center; }
.pie-pair .subhead{ margin-bottom:0; }

/* KPI tiles */
.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
.tile{ background:var(--panel-alt); border:1px solid var(--line); border-radius:12px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:4px; min-width:0; }
.tile .tl{ font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
.tile .tv{ font-size:25px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; }
.tile .tc{ font-size:12px; color:var(--ink-soft); }
.tile.green{ background:var(--primary-soft); border-color:#9fd3bd; } .tile.green .tv{ color:#1f7a59; }
.tile.yellow{ background:var(--gold-soft); border-color:#e6c98c; } .tile.yellow .tv{ color:#9a6f1f; }
.tile.red{ background:var(--low-soft); border-color:#e9b3a6; } .tile.red .tv{ color:#a54632; }
.awaited{ color:var(--ink-soft) !important; font-size:20px !important; font-weight:600 !important; }

/* At a glance cards: 8 cards (SD Index + 7 components) in a 4 x 2 grid */
.glance{ display:grid !important; grid-template-columns:repeat(3,minmax(0,1fr)) !important; gap:14px; }
@media (max-width:980px){ .glance{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; } }
@media (max-width:520px){ .glance{ grid-template-columns:1fr !important; } }
.gcard.green{ background:var(--primary-soft); border-color:#9fd3bd; } .gcard.green .gv{ color:#1f7a59; }
.gcard.yellow{ background:var(--gold-soft); border-color:#e6c98c; } .gcard.yellow .gv{ color:#9a6f1f; }
.gcard.red{ background:var(--low-soft); border-color:#e9b3a6; } .gcard.red .gv{ color:#a54632; }
.gcard.index{ border-width:2px; }
.gcard .gfoot .track{ background:rgba(255,255,255,.7); }
/* distribution of blocks across colour bands */
.distbar{ display:flex; height:22px; border-radius:999px; overflow:hidden; background:var(--grey-soft); font-size:11.5px; font-weight:700; color:#fff; }
.distbar span{ display:flex; align-items:center; justify-content:center; min-width:0; white-space:nowrap; overflow:hidden; }
/* paired bars (disability vs regular SHGs) */
.pb{ padding:8px 0; border-top:1px solid var(--line); } .pb:first-of-type{ border-top:none; }
.pb-l{ font-size:13.5px; font-weight:600; margin-bottom:6px; }
.pb-row{ display:grid; grid-template-columns:96px 1fr 48px; gap:10px; align-items:center; margin:4px 0; font-size:12px; color:var(--ink-soft); }
.pb-row b{ text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; }
.pb-row .track{ height:12px; }
/* performance table (SD Index tab), styled after the CLF tracker's District Performance table */
.perf-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.perf-search{ font-family:inherit; font-size:13.5px; padding:9px 14px; border-radius:10px; border:1px solid var(--line-strong); background:#fff; min-width:240px; }
.perf th{ cursor:pointer; user-select:none; }
.perf th:hover{ color:var(--ink); }
.perf th.num, .perf td.num{ text-align:right; }
.perf td{ padding:12px 10px; }
.perf td.nm a{ font-weight:700; text-decoration:none; cursor:pointer; }
.perf td.nm a.g{ color:#1f7a59; } .perf td.nm a.y{ color:#9a6f1f; } .perf td.nm a.r{ color:#a54632; }
.perf td.nm a:hover{ text-decoration:underline; }
.perf td.rk{ font-family:"Iowan Old Style",Georgia,serif; font-size:16px; font-weight:700; color:var(--ink-soft); }
.perf td.idx{ font-weight:700; font-size:14.5px; }
.perf tr.me td{ background:var(--primary-soft); }
.perf .g{ color:#1f7a59; } .perf .y{ color:#9a6f1f; } .perf .r{ color:#a54632; }
.perf tbody tr:hover td{ background:var(--panel-alt); }
/* last-updated strip */
.updated{ margin-top:10px; font-size:12.5px; color:var(--ink-soft); }
.updated summary{ cursor:pointer; list-style:none; display:inline-flex; gap:8px; align-items:center; }
.updated summary::-webkit-details-marker{ display:none; }
.updated summary b{ color:var(--ink); }
.updated summary .lnk{ color:var(--primary); font-weight:600; }
.updated .src{ margin-top:10px; background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; padding:10px 14px; max-width:720px; }
.updated .src table td{ padding:6px 8px; font-size:12.5px; }
/* data checks */
.sev{ display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }
.sev.error{ background:var(--low-soft); color:#a54632; } .sev.check{ background:var(--gold-soft); color:#8a6420; }
.chk-filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.chk-filters select, .chk-filters input{ font-family:inherit; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--line-strong); background:#fff; }
.chk-table td{ vertical-align:top; white-space:normal; }
.chk-table th.num, .chk-table td.num{ text-align:right; font-variant-numeric:tabular-nums; }
.chk-table td.nm a{ color:var(--primary); font-weight:600; cursor:pointer; }
.chk-table td.det{ color:var(--ink-soft); font-size:12.5px; max-width:460px; }
.issue{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; padding:10px 0; border-top:1px solid var(--line); }
.issue:first-child{ border-top:none; padding-top:0; }
.issue .it{ font-weight:600; font-size:13.5px; } .issue .id{ grid-column:2; font-size:12.5px; color:var(--ink-soft); }
/* period selector + month banner */
.navfield.periodfield{ min-width:190px; flex:0 0 auto; }
.navfield select#sel-period{ font-weight:700; color:var(--primary); border-color:var(--primary); }
.month-panel{ background:var(--primary-soft); border:1px solid #9fd3bd; border-radius:14px; padding:18px 20px; }
.month-panel .tile{ background:#fff; }
/* export menu */
.export-wrap{ position:relative; }
.export-menu{ position:absolute; right:0; top:calc(100% + 6px); background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; box-shadow:0 8px 24px rgba(30,35,32,.12); padding:6px; z-index:50; min-width:220px; }
.export-menu button{ display:block; width:100%; text-align:left; appearance:none; border:none; background:none; font-family:inherit; font-size:13.5px; padding:9px 12px; border-radius:7px; cursor:pointer; color:var(--ink); }
.export-menu button:hover{ background:var(--panel-alt); }
.export-menu button small{ display:block; color:var(--ink-soft); font-size:11.5px; }
.explore-bar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
/* At a glance cards (base) */
.glance{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
.gcard{ background:var(--panel); border:1px solid var(--line-strong); border-radius:14px; padding:18px 18px 16px; display:flex; flex-direction:column; gap:6px; cursor:pointer; text-align:left; font-family:inherit; color:inherit; transition:border-color .15s, box-shadow .15s; }
.gcard:hover{ border-color:var(--primary); box-shadow:0 4px 14px rgba(30,35,32,.07); }
.gcard .gh{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.gcard .gname{ font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); }
.gcard .gv{ font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15; margin-top:4px; }
.gcard .gc{ font-size:12.5px; color:var(--ink-soft); min-height:2.6em; }
.gcard .gfoot{ margin-top:6px; padding-top:10px; border-top:1px solid var(--line); }
.pill{ display:inline-block; font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; background:var(--grey-soft); color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap; }
.pill.green{ background:var(--primary-soft); color:#1f7a59; } .pill.yellow{ background:var(--gold-soft); color:#9a6f1f; } .pill.red{ background:var(--low-soft); color:#a54632; }

/* score bars (0-100) */
.sbar{ display:grid; grid-template-columns:minmax(110px,34%) 1fr 54px; align-items:center; gap:12px; padding:7px 0; }
.sbar .sl{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sbar .sl small{ display:block; font-weight:400; color:var(--ink-soft); font-size:11.5px; white-space:normal; }
.track{ height:10px; border-radius:999px; background:var(--grey-soft); overflow:hidden; }
.track .fill{ height:100%; border-radius:999px; background:var(--primary); }
.fill.green{ background:var(--primary); } .fill.yellow{ background:var(--gold); } .fill.red{ background:var(--low); } .fill.none{ background:transparent; }
.sbar .sv{ font-size:14px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.sbar.thin .track{ height:7px; } .sbar.thin{ padding:4px 0; } .sbar.thin .sl{ font-size:12.5px; font-weight:500; }

/* overall score block */
.overall-wrap{ display:grid; grid-template-columns:minmax(200px,260px) 1fr; gap:28px; align-items:center; }
.overall-big{ text-align:center; padding:8px; }
.overall-big .ov{ font-size:52px; font-weight:700; line-height:1; color:var(--primary); font-variant-numeric:tabular-nums; }
.overall-big .ovl{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700; margin-top:6px; }
.standing{ display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
.standing div{ background:var(--panel-alt); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:12px; color:var(--ink-soft); text-align:center; }
.standing b{ display:block; font-size:18px; color:var(--ink); }
@media (max-width:700px){ .overall-wrap{ grid-template-columns:1fr; } }

/* value bar lists */
.vbar{ display:grid; grid-template-columns:minmax(100px,40%) 1fr auto; align-items:center; gap:12px; padding:6px 0; }
.vbar .vl{ font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vbar .vv{ font-size:12.5px; color:var(--ink-soft); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:92px; }
.vbar .vv b{ color:var(--ink); font-weight:600; }
.vbar .track{ height:8px; }
.more-btn{ appearance:none; border:none; background:none; color:var(--primary); font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; padding:6px 0 0; }

/* stacked 100% bar */
.stack{ display:flex; height:16px; border-radius:999px; overflow:hidden; background:var(--grey-soft); }
.stack span{ height:100%; }
.stack-legend{ display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; font-size:12.5px; color:var(--ink-soft); }
.stack-legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.stack-legend b{ color:var(--ink); font-weight:600; }

/* segmented control */
.seg{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.seg button{ appearance:none; border:1px solid var(--line-strong); background:var(--panel); color:var(--ink-soft); border-radius:999px; padding:6px 13px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
.seg button.on{ background:var(--primary); border-color:var(--primary); color:#fff; }

/* ranking list */
.rl-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.rl-head select{ font-family:inherit; font-size:13px; padding:7px 10px; border-radius:8px; border:1px solid var(--line-strong); background:#fff; }
.rl-row{ display:grid; grid-template-columns:34px minmax(110px,1.1fr) 2fr 52px 18px; align-items:center; gap:12px; padding:9px 8px; border-top:1px solid var(--line); cursor:pointer; border-radius:8px; }
.rl-row:hover{ background:var(--panel-alt); }
.rl-row.me{ background:var(--primary-soft); }
.rl-row .rk{ font-family:"Iowan Old Style",Georgia,serif; font-size:16px; font-weight:700; color:var(--ink-soft); }
.rl-row .nm{ font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rl-row .nm small{ font-weight:400; color:var(--ink-soft); }
.rl-row .vl{ font-size:14px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.rl-row .chev{ color:var(--ink-soft); font-size:12px; transition:transform .15s; }
.rl-row.open .chev{ transform:rotate(90deg); }
.rl-detail{ padding:6px 8px 16px 54px; display:none; }
.rl-scroll{ max-height:470px; overflow-y:auto; padding-right:4px; }
.rl-detail.open{ display:block; }
.rl-detail .cols{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:4px 28px; }
.open-btn{ appearance:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:700; color:#fff; background:var(--primary); border:none; border-radius:999px; padding:7px 16px; margin-top:10px; }
@media (max-width:600px){ .rl-row{ grid-template-columns:28px 1fr 46px 14px; } .rl-row .track{ display:none; } .rl-detail{ padding-left:8px; } }

/* buttons, weights modal (as in CLF tracker) */
.weight-btn{ appearance:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--primary); background:var(--primary-soft); border:1px solid var(--line-strong); border-radius:999px; padding:8px 16px; }
.weight-modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(30,35,32,0.45); z-index:100; align-items:center; justify-content:center; padding:20px; }
.weight-modal-backdrop.open{ display:flex; }
.weight-modal{ background:var(--panel); border-radius:14px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; padding:26px 28px; }
.weight-modal-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
.weight-modal-head h3{ font-size:19px; font-weight:600; margin:0; }
.weight-modal-close{ appearance:none; border:none; background:none; cursor:pointer; font-size:22px; color:var(--ink-soft); }
.weight-modal-hint{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 20px; }
.weight-row{ margin-bottom:16px; }
.weight-row-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.weight-row-head .wname{ font-size:13.5px; font-weight:600; }
.weight-row-head .wpct{ font-size:14px; font-weight:700; color:var(--primary); }
.weight-slider{ width:100%; accent-color:var(--primary); }
.weight-result{ margin-top:20px; padding:14px 16px; background:var(--panel-alt); border-radius:10px; border:1px solid var(--line); }
.weight-result-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.weight-result .wlabel{ font-size:12.5px; color:var(--ink-soft); }
.weight-result .wval{ font-size:18px; font-weight:700; color:var(--primary); }
.weight-modal-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:20px; }
.weight-reset-btn{ appearance:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--panel-alt); border:1px solid var(--line-strong); border-radius:999px; padding:8px 16px; }
.weight-done-btn{ appearance:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; color:#fff; background:var(--primary); border:none; border-radius:999px; padding:8px 20px; }

/* score detail rows */
.krow{ display:grid; grid-template-columns:1fr minmax(120px,30%) 64px; gap:16px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
.krow:first-child{ border-top:none; padding-top:0; }
.krow .kn{ font-size:14px; font-weight:600; }
.krow .kd{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.krow .kv{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; text-align:right; font-variant-numeric:tabular-nums; }
.krow .ks{ font-size:16px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.chip{ display:inline-block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:999px; margin-left:8px; vertical-align:2px; }
.chip.target{ background:var(--gold-soft); color:#8a6420; } .chip.pctl{ background:var(--primary-soft); color:#1f6f52; }
.cx{ border-top:1px solid var(--line); }
.cx:first-of-type{ border-top:none; }
.cx summary{ list-style:none; cursor:pointer; display:grid; grid-template-columns:minmax(120px,30%) 1fr 64px 16px; gap:12px; align-items:center; padding:12px 6px; border-radius:8px; }
.cx summary::-webkit-details-marker{ display:none; }
.cx summary:hover{ background:var(--panel-alt); }
.cx summary .sl{ font-size:14px; font-weight:600; }
.cx summary .sl small{ display:block; font-weight:400; font-size:11.5px; color:var(--ink-soft); }
.cx summary .sv{ font-size:15px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.cx summary .chev{ color:var(--ink-soft); font-size:11px; transition:transform .15s; }
.cx[open] summary .chev{ transform:rotate(90deg); }
.cx .cx-body{ padding:4px 6px 16px 18px; border-left:3px solid var(--line); margin:0 0 10px 8px; }
.score-head{ display:grid; grid-template-columns:minmax(180px,230px) 1fr; gap:28px; align-items:center; }
@media (max-width:700px){ .score-head{ grid-template-columns:1fr; } .cx summary{ grid-template-columns:1fr 56px 14px; } .cx summary .track{ display:none; } }
.comp-total{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:14px; border-top:2px solid var(--ink); }
.comp-total .sname{ font-size:15px; font-weight:700; } .comp-total .sval{ font-size:24px; font-weight:700; color:var(--primary); }
@media (max-width:600px){ .krow{ grid-template-columns:1fr 60px; } .krow .track{ display:none; } }

/* map legend + tables */
.legend{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; font-size:12.5px; color:var(--ink-soft); margin-top:10px; }
.legend i{ display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
.chart-select{ font-family:inherit; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--line-strong); background:#fff; max-width:100%; }
.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
thead th{ text-align:left; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; padding:0 10px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
tbody td{ padding:10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
tbody tr:last-child td{ border-bottom:none; }
.explore-map g.scatterlayer text{ pointer-events:none; paint-order:stroke fill; stroke:#ffffff; stroke-width:0.18em; stroke-linejoin:round; }
.footer-note{ font-size:12px; color:var(--ink-soft); margin-top:44px; padding-top:16px; border-top:1px solid var(--line); }
@media (max-width:560px){ .container{ padding:16px 16px 60px; } .panel{ padding:16px; } .tabbtn{ padding:9px 10px; font-size:13px; } .tile .tv{ font-size:22px; } }
</style>
</head>
<body>
<div class="container">
  <header class="top">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
      <div>
        <h1 class="serif">Social Development Tracker</h1>
        <p class="hint">Gender (DAK) &middot; VRF &middot; VPRP &middot; Didi ki Nursery &middot; VanMitra Plantation &middot; Disability SHGs &middot; Second Chance</p>
        <details class="updated" id="updated"></details>
      </div>
      <div class="export-wrap"><button id="btn-export-excel" class="weight-btn" style="white-space:nowrap;" aria-haspopup="true" aria-expanded="false">&#128190; Export to Excel &#9662;</button>
        <div class="export-menu" id="export-menu" hidden><button data-x="view" id="export-view">This view</button><button data-x="all">All of Bihar<small>every block and district</small></button></div></div>
    </div>
    <div class="navbar">
      <div class="navfield"><label for="sel-district">District</label><select id="sel-district"><option value="">— All Bihar (State view) —</option></select></div>
      <div class="navfield"><label for="sel-block">Block</label><select id="sel-block" disabled><option value="">— Whole district —</option></select></div>
      <div class="navfield periodfield"><label for="sel-period">Period</label><select id="sel-period"></select></div>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <nav class="tabbar" id="tabbar" aria-label="Components"></nav>
  </header>
  <div id="app"><p class="disclaimer">Loading…</p></div>
</div>

<script>
// ============================================================================
// Formatting
// ============================================================================
function fmtNum(v){ if(v==null) return '—'; return Math.round(v).toLocaleString('en-IN'); }
function fmtPct(v, d){ if(v==null) return '—'; return v.toFixed(d==null?1:d)+'%'; }
function fmtRs(v){
  if(v==null) return '—';
  const a = Math.abs(v);
  if(a>=1e7) return '₹'+(v/1e7).toFixed(2)+' Cr';
  if(a>=1e5) return '₹'+(v/1e5).toFixed(2)+' L';
  return '₹'+Math.round(v).toLocaleString('en-IN');
}
function fmtScore(v){ return v==null ? '—' : v.toFixed(1); }
function fmtKpi(key, v){
  if(v==null) return '—';
  const u = KPI_BY[key].unit;
  if(u==='pct') return fmtPct(v);
  if(u==='x') return v.toFixed(2)+'×';
  if(u==='per1000') return v.toFixed(1)+' per 1,000';
  if(u==='per100') return v.toFixed(1)+' per 100';
  if(u==='score') return v.toFixed(1);
  return fmtNum(v);
}
function ord(n){ const s=["th","st","nd","rd"], v=n%100; return s[(v-20)%10]||s[v]||s[0]; }
function bucket(score){ if(score==null) return 'none'; if(score>=66) return 'green'; if(score>=33) return 'yellow'; return 'red'; }
function monthLabel(ym){ const [y,m]=ym.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+" '"+y.slice(2); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const COLORS = {green:'#2F9C74', yellow:'#CE9C3C', red:'#C55F49', grey:'#D9DED9', none:'#D9DED9'};
const SERIES = ['#2F9C74','#CE9C3C','#5B8DB8','#C55F49','#8E7CC3','#9AA5A0'];

// ============================================================================
// Data loading. Opened straight from disk (file://) fetch() is blocked, so the
// page loads data/bundle.js (every data file in one script, written by
// build_sd_data.py). Served over http it fetches files one at a time.
// ============================================================================
const FROM_DISK = location.protocol === 'file:';
function loadBundle(){
  return new Promise((resolve, reject)=>{
    if(window.SD_BUNDLE) return resolve();
    const s = document.createElement('script');
    s.src = 'data/bundle.js';
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('data/bundle.js not found - re-run build_sd_data.py'));
    document.head.appendChild(s);
  });
}
async function fetchJson(path){
  if(FROM_DISK){
    await loadBundle();
    const d = window.SD_BUNDLE[path];
    if(d===undefined) throw new Error('missing from bundle: '+path);
    return d;
  }
  const res = await fetch(path);
  if(!res.ok) throw new Error('fetch failed: '+path);
  return res.json();
}

// ============================================================================
// State + navigation
// ============================================================================
let MANIFEST=null, STATE_DATA=null, DISTRICT_DATA=null, BLOCK_DATA=null, SCORING_SUMMARY=null;
// Each data file holds the cumulative figures at the top level, the parts that
// change by calendar year under periods[year], and month-by-month DAK and
// nursery figures under monthly[YYYY-MM]. *_DATA are views for the period chosen.
let RAW_STATE=null, RAW_DISTRICT=null, RAW_BLOCK=null;
let PERIOD = 'cumulative';
function yearKey(){ if(PERIOD==='cumulative' || /^\d{4}$/.test(PERIOD)) return PERIOD; const y = PERIOD.slice(0,4); return (META.period_keys||[]).includes(y) ? y : 'cumulative'; }
function isMonth(){ return /^\d{4}-\d{2}$/.test(PERIOD); }
function view(raw){ if(!raw) return null; const y = yearKey(); return (y==='cumulative' || !raw.periods || !raw.periods[y]) ? raw : Object.assign({}, raw, raw.periods[y]); }
function applyPeriod(){ STATE_DATA = view(RAW_STATE); DISTRICT_DATA = view(RAW_DISTRICT); BLOCK_DATA = view(RAW_BLOCK); }
function periodText(){
  if(PERIOD==='cumulative') return 'Cumulative';
  if(isMonth()) return monthLabel(PERIOD).replace(" '", ' 20');
  const latest = Math.max(...(META.period_keys||[]).filter(k=>k!=='cumulative').map(Number));
  return PERIOD + (Number(PERIOD)===latest ? ' (so far)' : '');
}
function rawUnit(){ return SCOPE==='block' ? RAW_BLOCK : SCOPE==='district' ? RAW_DISTRICT : RAW_STATE; }
let SCOPE='state', TAB='overview';
let META=null, COMPS=[], SCORED_COMPS=[], KPI_BY={}, DEFAULT_W={};
let W=null;   // current component weights
const TABS = [{key:'overview', label:'Overview'}];

async function init(){
  RAW_STATE = await fetchJson('data/state.json');
  META = RAW_STATE.meta;
  STATE_DATA = RAW_STATE;
  // period selector: cumulative, calendar years, then months
  const ps = document.getElementById('sel-period');
  const years = (META.period_keys||[]).filter(k=>k!=='cumulative');
  const latestY = Math.max(...years.map(Number));
  ps.innerHTML = `<option value="cumulative">Cumulative</option><optgroup label="Year">${years.map(y=>`<option value="${y}">${y}${Number(y)===latestY?' (so far)':''}</option>`).join('')}</optgroup>`
;
  try{ const sp = localStorage.getItem('sd-period'); if(sp && [...ps.options].some(o=>o.value===sp)) PERIOD = sp; }catch(e){}
  ps.value = PERIOD;
  ps.addEventListener('change', e=>{ PERIOD = e.target.value; try{ localStorage.setItem('sd-period', PERIOD); }catch(_){} SCORING_SUMMARY_P=null; applyPeriod(); refreshView(); });
  applyPeriod();
  COMPS = META.components;
  META.kpis.forEach(k=> KPI_BY[k.key]=k);
  SCORED_COMPS = COMPS.filter(c=> META.kpis.some(k=>k.component===c.key));
  COMPS.forEach(c=>{ DEFAULT_W[c.key] = c.weight!=null ? c.weight : 1; TABS.push({key:c.key, label:c.label}); });
  TABS.push({key:'score', label:'SD Index'});
  TABS.push({key:'checks', label:'Discrepancy Report'});
  W = {...DEFAULT_W};
  // "last updated" strip: newest scrape across sources, with a per-source list
  if(META.sources){
    document.getElementById('updated').innerHTML = `<summary>Data last updated <b>${esc(META.last_updated||'—')}</b><span class="lnk">dates by source ▾</span></summary>
      <div class="src"><table><thead><tr><th>Source</th><th>Last scraped</th><th>Covers</th></tr></thead><tbody>${
        META.sources.map(s=>`<tr><td><b>${esc(s.source)}</b></td><td>${esc(s.updated||'—')}</td><td>${esc(s.covers||'')}</td></tr>`).join('')}</tbody></table></div>`;
  }
  try{ const t = localStorage.getItem('sd-tab'); if(t && TABS.some(x=>x.key===t)) TAB=t; }catch(e){}
  if(location.hash && TABS.some(x=>x.key===location.hash.slice(1))) TAB = location.hash.slice(1);
  document.getElementById('tabbar').innerHTML = TABS.map(t=>`<button class="tabbtn" data-tab="${t.key}">${t.label}</button>`).join('');
  document.querySelectorAll('.tabbtn').forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.tab)));
  MANIFEST = await fetchJson('data/manifest.json');
  const dSel = document.getElementById('sel-district');
  MANIFEST.districts.forEach(d=> dSel.insertAdjacentHTML('beforeend', `<option value="${d.slug}">${d.name}</option>`));
  dSel.addEventListener('change', e=> onDistrictChange(e.target.value));
  document.getElementById('sel-block').addEventListener('change', e=> onBlockChange(e.target.value));
  const xbtn = document.getElementById('btn-export-excel'), xmenu = document.getElementById('export-menu');
  xbtn.addEventListener('click', e=>{ e.stopPropagation();
    document.getElementById('export-view').innerHTML = SCOPE==='state' ? 'This view<small>same as All of Bihar</small>' : `This view<small>${esc(scopeName())} only</small>`;
    xmenu.hidden = !xmenu.hidden; xbtn.setAttribute('aria-expanded', !xmenu.hidden); });
  xmenu.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ xmenu.hidden = true; exportToExcel(b.dataset.x); }));
  document.addEventListener('click', ()=>{ xmenu.hidden = true; });
  refreshView();
}
function setTab(t){
  TAB=t; try{ localStorage.setItem('sd-tab', TAB); }catch(e){}
  history.replaceState(null,'','#'+TAB); refreshView(); window.scrollTo({top:document.getElementById('tabbar').offsetTop-10});
}
function currentUnit(){ return SCOPE==='block' ? BLOCK_DATA : SCOPE==='district' ? DISTRICT_DATA : STATE_DATA; }

async function onDistrictChange(slug){
  const bSel = document.getElementById('sel-block');
  document.getElementById('sel-district').value = slug;
  if(!slug){ bSel.innerHTML='<option value="">— Whole district —</option>'; bSel.disabled=true; RAW_DISTRICT=null; RAW_BLOCK=null; applyPeriod(); SCOPE='state'; refreshView(); return; }
  RAW_DISTRICT = await fetchJson(`data/districts/${slug}.json`); RAW_BLOCK = null; applyPeriod();
  const manDist = MANIFEST.districts.find(d=>d.slug===slug);
  bSel.innerHTML = `<option value="">— Whole district —</option>` + manDist.blocks.map(b=>`<option value="${b.slug}">${b.name}</option>`).join('');
  bSel.disabled = false;
  SCOPE='district'; refreshView();
}
async function onBlockChange(slug){
  document.getElementById('sel-block').value = slug;
  if(!slug){ RAW_BLOCK=null; applyPeriod(); SCOPE='district'; refreshView(); return; }
  RAW_BLOCK = await fetchJson(`data/blocks/${slug}.json`); applyPeriod();
  SCOPE='block'; refreshView();
}
async function navToDistrict(slug){ await onDistrictChange(slug); window.scrollTo({top:0}); }
async function navToBlock(blockSlug){
  const dist = MANIFEST.districts.find(d=> d.blocks.some(b=>b.slug===blockSlug));
  if(!dist) return;
  if(!DISTRICT_DATA || document.getElementById('sel-district').value!==dist.slug) await onDistrictChange(dist.slug);
  await onBlockChange(blockSlug); window.scrollTo({top:0});
}
function setCrumbs(){
  const parts = ['<b>Bihar</b>'];
  if(DISTRICT_DATA && SCOPE!=='state') parts.push(SCOPE==='district' ? '<b>'+DISTRICT_DATA.name+'</b>' : DISTRICT_DATA.name);
  if(BLOCK_DATA && SCOPE==='block') parts.push('<b>'+BLOCK_DATA.name+'</b>');
  document.getElementById('crumbs').innerHTML = parts.join(' &rsaquo; ');
}
function scopeName(){ return SCOPE==='block' ? BLOCK_DATA.name+' block' : SCOPE==='district' ? DISTRICT_DATA.name+' district' : 'Bihar'; }

let AFTER = [];
function refreshView(){
  setCrumbs();
  document.querySelectorAll('.tabbtn').forEach(b=> b.classList.toggle('active', b.dataset.tab===TAB));
  window.__lists = {};
  AFTER = [];
  const unit = currentUnit();
  if(TAB==='checks'){ renderChecks(); return; }
  document.getElementById('app').innerHTML = TAB==='overview' ? overviewHtml(unit) : TAB==='score' ? scorecardHtml(unit) : componentHtml(TAB, unit);
  AFTER.forEach(fn=>fn());
  document.querySelectorAll('.btn-open-weights').forEach(b=> b.addEventListener('click', openWeightModal));
  wireMore();
}

// ============================================================================
// Visual building blocks
// ============================================================================
function section(title, hint, inner, bare){
  return `<section><div class="section-head"><h2 class="serif">${title}</h2>${hint?`<span class="hint">${hint}</span>`:''}</div>${bare?inner:`<div class="panel">${inner}</div>`}</section>`;
}
function card(inner, title){ return `<div class="panel card">${title?`<div class="subhead">${title}</div>`:''}<div class="cbody">${inner}</div></div>`; }
function tile(label, value, caption, score){
  return `<div class="tile ${score!=null?bucket(score):''}"><div class="tl">${label}</div><div class="tv">${value}</div>${caption?`<div class="tc">${caption}</div>`:''}</div>`;
}
function tiles(list){ return `<div class="tiles">${list.join('')}</div>`; }
function note(t){ return `<div class="note">${t}</div>`; }
function sbar(label, score, opts){
  opts = opts||{};
  const w = score==null ? 0 : Math.max(2, Math.min(100, score));
  return `<div class="sbar${opts.thin?' thin':''}"><div class="sl" title="${esc(opts.title||'')}">${label}${opts.sub?`<small>${opts.sub}</small>`:''}</div>
    <div class="track"><div class="fill ${bucket(score)}" style="width:${w}%"></div></div><div class="sv">${opts.text!=null?opts.text:fmtScore(score)}</div></div>`;
}
// value bar list, top N with a "show more" toggle
let MORE_ID=0;
function vbars(items, opts){
  opts = opts||{};
  const top = opts.top||5;
  if(!items || !items.length) return `<p class="disclaimer" style="margin:0;">${opts.empty||'No data.'}</p>`;
  const max = Math.max(...items.map(i=>i.n||0)) || 1;
  const id = 'mb'+(++MORE_ID);
  const rows = items.map((i,ix)=>`<div class="vbar"${ix>=top?` data-more="${id}" hidden`:''}><div class="vl" title="${esc(i.label)}">${esc(i.label)}</div>
    <div class="track"><div class="fill" style="width:${Math.max(1.5,(i.n||0)/max*100)}%;background:${opts.color||'var(--primary)'}"></div></div>
    <div class="vv"><b>${opts.money?fmtRs(i.n):fmtNum(i.n)}</b> &middot; ${fmtPct(i.pct,0)}</div></div>`).join('');
  return rows + (items.length>top ? `<button class="more-btn" data-more-btn="${id}">Show all ${items.length}</button>` : '');
}
function wireMore(){
  document.querySelectorAll('[data-more-btn]').forEach(b=> b.addEventListener('click', ()=>{
    const rows = document.querySelectorAll(`[data-more="${b.dataset.moreBtn}"]`);
    const show = rows[0] && rows[0].hidden;
    rows.forEach(r=> r.hidden = !show);
    b.textContent = show ? 'Show fewer' : `Show all ${rows.length + 5}`;
  }));
}
// "share of" figure: a donut with the legend underneath, centred
let PIE_ID=0;
function stack(items, colors, opts){
  opts = opts||{};
  items = (items||[]).filter(i=>i.pct>0);
  if(!items.length) return `<p class="disclaimer" style="margin:0;text-align:center;">No data.</p>`;
  colors = colors || SERIES;
  const id = 'pie'+(++PIE_ID);
  AFTER.push(()=> drawPie(id, items, colors, opts));
  return `<div id="${id}" class="pie${opts.legendRight?' wide':''}"></div>`;
}
function drawPie(id, items, colors, opts){
  const el = document.getElementById(id); if(!el) return;
  Plotly.newPlot(id, [{type:'pie', hole:0.58, sort:false, direction:'clockwise',
    labels:items.map(i=>i.label), values:items.map(i=>i.pct),
    marker:{colors:items.map((i,ix)=>colors[ix%colors.length]), line:{color:'#fff', width:2}},
    textinfo:'percent', texttemplate:'%{percent:.0%}', textposition:'inside', insidetextfont:{color:'#fff', size:12},
    hovertemplate:'%{label}: %{percent:.1%}<extra></extra>'}],
    {height:opts.height||250, margin:{t:6,b:6,l:6,r:6}, paper_bgcolor:'rgba(0,0,0,0)', showlegend:true,
     legend: opts.legendRight ? {orientation:'v', x:1.02, xanchor:'left', y:0.5, yanchor:'middle', font:{size:12.5}} : {orientation:'h', x:0.5, xanchor:'center', y:-0.04, yanchor:'top', font:{size:12}},
     font:{family:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif', color:'#1E2320'},
     annotations: opts.center ? [{text:opts.center, showarrow:false, font:{size:14, color:'#1E2320'}, x:0.5, y:0.5, xref:'paper', yref:'paper'}] : []},
    {displayModeBar:false, responsive:true});
}
// segmented switcher between several lists
let SEG_ID=0;
function switcher(views){
  const id = 'sw'+(++SEG_ID);
  AFTER.push(()=>{
    const root = document.getElementById(id); if(!root) return;
    root.querySelectorAll('.seg button').forEach(b=> b.addEventListener('click', ()=>{
      root.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', x===b));
      root.querySelectorAll('[data-view]').forEach(v=> v.hidden = v.dataset.view!==b.dataset.v);
      root.querySelectorAll(`[data-view="${b.dataset.v}"] .js-plotly-plot`).forEach(p=> Plotly.Plots.resize(p));
    }));
  });
  return `<div id="${id}"><div class="seg">${views.map((v,i)=>`<button data-v="${i}" class="${i===0?'on':''}">${v.label}</button>`).join('')}</div>
    ${views.map((v,i)=>`<div data-view="${i}"${i?' hidden':''}>${v.html}</div>`).join('')}</div>`;
}
const PL_BASE = {margin:{t:6,b:40,l:50,r:16}, paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
  font:{family:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif', size:12, color:'#1E2320'},
  xaxis:{automargin:true, fixedrange:true}, yaxis:{automargin:true, gridcolor:'#E2E6E2', zeroline:false, fixedrange:true},
  legend:{orientation:'h', y:-0.22}, hoverlabel:{bgcolor:'#1E2320', font:{color:'#fff'}}};
function plot(id, traces, extra){
  if(!document.getElementById(id)) return Promise.resolve(null);
  const lay = Object.assign({}, PL_BASE, extra||{});
  lay.xaxis = Object.assign({}, PL_BASE.xaxis, (extra||{}).xaxis||{});
  lay.yaxis = Object.assign({}, PL_BASE.yaxis, (extra||{}).yaxis||{});
  return Plotly.newPlot(id, traces, lay, {displayModeBar:false, responsive:true, scrollZoom:false});
}

// ============================================================================
// Weights (component level). Defaults come from the data; viewers can change
// them for this session. Missing components drop out and the rest rescale.
// ============================================================================
function wOverall(comp){
  let num=0, den=0;
  SCORED_COMPS.forEach(c=>{ const v=comp[c.key]; if(v!=null){ num+=W[c.key]*v; den+=W[c.key]; } });
  return den>0 ? num/den : null;
}
function isDefaultW(){ return COMPS.every(c=> W[c.key]===DEFAULT_W[c.key]); }
function rowComp(r){ const o={}; SCORED_COMPS.forEach(c=> o[c.key]=r['comp_'+c.key]); return o; }
function rowOverall(r){ return isDefaultW() ? r.overall_score : wOverall(rowComp(r)); }
// SD Index order with no shared places: the build's tie-free order for the
// agreed weights; otherwise exact ties go to the higher DAK score, then A-Z.
function byIndex(a, b){
  if(isDefaultW() && a.overall_sort!=null && b.overall_sort!=null) return b.overall_sort - a.overall_sort;
  const d = (rowOverall(b)??-1) - (rowOverall(a)??-1); if(Math.abs(d) > 1e-9) return d;
  const k = (b.comp_dak??-1) - (a.comp_dak??-1); if(k) return k;
  return String(a.name).localeCompare(String(b.name));
}
function unitOverall(u){ return isDefaultW() ? u.overall_score : wOverall(u.comp_scores); }
let SCORING_SUMMARY_P = null;
async function ensureScoringSummary(){ if(!SCORING_SUMMARY) SCORING_SUMMARY = await fetchJson('data/scoring_summary.json'); return (SCORING_SUMMARY.periods||{})[yearKey()] || SCORING_SUMMARY.periods.cumulative; }
function weightLine(){
  const tot = COMPS.reduce((a,c)=>a+W[c.key],0) || 1;
  return COMPS.map(c=> W[c.key] ? `${c.label} ${Math.round(W[c.key]/tot*100)}%` : `${c.label} (weight to be agreed)`).join(' &middot; ');
}
function openWeightModal(){
  const ex = document.getElementById('weight-modal-backdrop'); if(ex) ex.remove();
  document.body.insertAdjacentHTML('beforeend', `<div class="weight-modal-backdrop open" id="weight-modal-backdrop"><div class="weight-modal" role="dialog" aria-labelledby="wm-title">
    <div class="weight-modal-head"><h3 id="wm-title">Component Weights</h3><button class="weight-modal-close" id="wm-x" aria-label="Close">&times;</button></div>
    <p class="weight-modal-hint">Drag a slider to change how much each component counts toward the SD Index. Weights are relative: a component a block has no score for (no DAK, Second Chance until data arrives) drops out and the rest are rescaled.</p>
    <div id="weight-rows"></div>${SCOPE==='state'?'':'<div class="weight-result" id="weight-result"></div>'}
    <div class="weight-modal-actions"><button class="weight-reset-btn" id="wm-reset">Reset to agreed weights</button><button class="weight-done-btn" id="wm-done">Done</button></div></div></div>`);
  const close = ()=>{ document.getElementById('weight-modal-backdrop').remove(); refreshView(); };
  document.getElementById('wm-x').onclick = close; document.getElementById('wm-done').onclick = close;
  document.getElementById('weight-modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='weight-modal-backdrop') close(); });
  document.getElementById('wm-reset').onclick = ()=>{ W={...DEFAULT_W}; renderW(); };

}
function renderW(){
  const tot = COMPS.reduce((a,c)=>a+W[c.key],0) || 1;
  document.getElementById('weight-rows').innerHTML = COMPS.map(c=>`<div class="weight-row"><div class="weight-row-head"><label class="wname" for="w-${c.key}">${c.label}${SCORED_COMPS.some(s=>s.key===c.key)?'':' <span class="hint">(no data yet)</span>'}</label><span class="wpct">${Math.round(W[c.key]/tot*100)}%</span></div>
    <input id="w-${c.key}" type="range" min="0" max="100" value="${W[c.key]}" class="weight-slider" data-k="${c.key}"></div>`).join('');
  document.querySelectorAll('.weight-slider').forEach(el=> el.addEventListener('input', e=>{ W[e.target.dataset.k]=+e.target.value; renderW(); }));
  renderWResult();
}
let wReq=0;
async function renderWResult(){
  const box = document.getElementById('weight-result'); if(!box) return;
  const my=++wReq, unit=currentUnit(), s=await ensureScoringSummary();
  const pool = SCOPE==='block' ? s.blocks : s.districts;
  const myId = SCOPE==='block' ? unit.block_id : unit.district_geo_id;
  const scored = pool.map(r=>({id:r.id, v:wOverall(r.comp)})).filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
  const rank = scored.findIndex(r=>r.id===myId)+1;
  if(my!==wReq) return;
  box.innerHTML = `<div class="weight-result-row"><span class="wlabel">SD Index</span><span class="wval">${fmtScore(wOverall(unit.comp_scores))} / 100</span></div>
    <div class="weight-result-row"><span class="wlabel">Statewide rank</span><span class="wval" style="color:var(--gold)">${rank>0?rank+ord(rank)+' of '+scored.length:'—'}</span></div>`;
}

// ============================================================================
// Ranking list: compact rows (rank, name, score bar, value); click a row to
// expand its details, with a button to open that place.
// opts: {sorts:[{key,label,val(r),fmt(r)}], detail(r), onOpen(r), openLabel, meId, idKey, sub(r)}
// ============================================================================
let RL_ID=0;
function rankList(rows, opts){
  const id = 'rl'+(++RL_ID);
  window.__lists[id] = {rows, opts, sort: opts.sorts[0].key};
  AFTER.push(()=> drawRankList(id));
  return `<div id="${id}"></div>`;
}
function drawRankList(id){
  const st = window.__lists[id]; const root = document.getElementById(id); if(!root) return;
  const s = st.opts.sorts.find(x=>x.key===st.sort) || st.opts.sorts[0];
  const rows = [...st.rows].sort((a,b)=>{ const av=s.val(a), bv=s.val(b); if(av==null) return 1; if(bv==null) return -1;
    if(s.key==='overall') return byIndex(a,b);
    return (bv-av) || String(a.name).localeCompare(String(b.name)); });
  const sel = (!st.opts.linked && st.opts.sorts.length>1) ? `<label class="hint">Sort by <select data-sort>${st.opts.sorts.map(x=>`<option value="${x.key}"${x.key===st.sort?' selected':''}>${x.label}</option>`).join('')}</select></label>` : '';
  const nNull = rows.filter(r=>s.val(r)==null).length;
  root.innerHTML = `<div class="rl-head"><span class="hint">${rows.length} ${st.opts.noun||''} by ${esc(s.label)}${nNull?` &middot; ${nNull} with no data, listed last`:''} &middot; click a row for details</span>${sel}</div><div class="${rows.length>12?'rl-scroll':''}">` +
    rows.map((r,i)=>{
      const v = s.val(r); const me = st.opts.meId!=null && r[st.opts.idKey]===st.opts.meId;
      return `<div class="rl-row${me?' me':''}" data-i="${st.rows.indexOf(r)}" role="button" tabindex="0" aria-expanded="false">
        <span class="rk">${v==null?'–':i+1}</span><span class="nm" style="color:${v==null?'var(--ink-soft)':COLORS[bucket(v)]}">${esc(r.name)}${st.opts.sub?` <small>${esc(st.opts.sub(r))}</small>`:''}</span>
        <div class="track"><div class="fill ${bucket(v)}" style="width:${v==null?0:Math.max(2,Math.min(100,v))}%"></div></div>
        <span class="vl">${v==null?'<span class="hint" style="font-weight:400;">no data</span>':fmtScore(v)}</span><span class="chev">&#9654;</span></div>
        <div class="rl-detail" data-d="${st.rows.indexOf(r)}"></div>`;
    }).join('') + '</div>';
  const selEl = root.querySelector('[data-sort]');
  if(selEl) selEl.addEventListener('change', e=>{ st.sort = e.target.value; drawRankList(id); });
  root.querySelectorAll('.rl-row').forEach(row=>{
    const toggle = ()=>{
      const i = +row.dataset.i, det = root.querySelector(`[data-d="${i}"]`), open = !det.classList.contains('open');
      if(open && !det.innerHTML){ const r = st.rows[i];
        det.innerHTML = st.opts.detail(r) + (st.opts.onOpen?`<button class="open-btn">Open ${esc(r.name)} &rarr;</button>`:'');
        const b = det.querySelector('.open-btn'); if(b) b.addEventListener('click', ()=> st.opts.onOpen(r)); }
      det.classList.toggle('open', open); row.classList.toggle('open', open); row.setAttribute('aria-expanded', open);
    };
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });
}
function setListSort(id, key){ const st = window.__lists[id]; if(st){ st.sort = key; drawRankList(id); } }
function compDetail(r){ return `<div class="cols">${SCORED_COMPS.map(c=> sbar(c.label, r['comp_'+c.key], {thin:true})).join('')}</div>`; }
function kpiDetail(comp){ return r=> `<div class="cols">${META.kpis.filter(k=>k.component===comp).map(k=> sbar(k.label, r[k.key+'__score'], {thin:true, sub: fmtKpi(k.key, r[k.key]), title:k.desc})).join('')}</div>`; }
// what the map colours and the ranking sorts by
function overallOptions(){
  return [{key:'overall', label:'SD Index', score:r=>rowOverall(r), fmt:r=>'SD Index '+fmtScore(rowOverall(r))}]
    .concat(SCORED_COMPS.map(c=>({key:c.key, label:c.label+' score', score:r=>r['comp_'+c.key], fmt:r=>c.label+' score '+fmtScore(r['comp_'+c.key])})));
}
function compOptions(comp){
  const c = COMPS.find(x=>x.key===comp);
  return [{key:'comp', label:c.label+' score', score:r=>r['comp_'+comp], fmt:r=>c.label+' score '+fmtScore(r['comp_'+comp])}]
    .concat(META.kpis.filter(k=>k.component===comp).map(k=>({key:k.key, label:k.label, score:r=>r[k.key+'__score'], fmt:r=>`${k.label}: ${fmtKpi(k.key, r[k.key])} (score ${fmtScore(r[k.key+'__score'])})`})));
}

// ============================================================================
// Map + ranking, driven by ONE selector. The map is interactive (hover,
// click) but locked in place (no drag, no zoom) so it never moves while the
// page scrolls.
// ============================================================================
let GEO_B=null, GEO_D=null;
const loadGeoBlocks = ()=> GEO_B || (GEO_B = fetchJson('data/geo/blocks_534.geojson'));
const loadGeoDistricts = ()=> GEO_D || (GEO_D = fetchJson('data/geo/districts_38.geojson'));
let EX_ID=0;
function legendHtml(){ return `<div class="legend"><span><i style="background:${COLORS.green}"></i>Score 66–100</span><span><i style="background:${COLORS.yellow}"></i>33–66</span><span><i style="background:${COLORS.red}"></i>Below 33</span><span><i style="background:${COLORS.grey}"></i>No data</span></div>`; }
function explore(rows, options, isDistrict, onOpen, opts){
  opts = opts||{};
  const id = 'ex'+(++EX_ID), mapId = id+'-map';
  const list = rankList(rows, {sorts:options.map(o=>({key:o.key, label:o.label, val:o.score})), linked:true,
    noun: isDistrict?'districts':'blocks', detail:opts.detail, onOpen, meId:opts.meId, idKey:opts.idKey});
  const listId = 'rl'+RL_ID;
  AFTER.push(()=>{
    const sel = document.getElementById(id+'-sel'); if(!sel) return;
    sel.addEventListener('change', ()=>{ const o = options.find(x=>x.key===sel.value); drawMapFor(mapId, rows, o, isDistrict, onOpen); setListSort(listId, o.key); });
    drawMapFor(mapId, rows, options[0], isDistrict, onOpen);
  });
  return `<section><div class="section-head"><h2 class="serif">${opts.title||'Explore by Place'}</h2><span class="hint">one choice updates both the map and the ranking</span></div>
    <div class="explore-bar"><label class="subhead" for="${id}-sel" style="margin:0;">Show</label>
      <select class="chart-select" id="${id}-sel">${options.map(o=>`<option value="${o.key}">${o.label}</option>`).join('')}</select>
      <span class="hint">hover the map for values &middot; click a ${isDistrict?'district':'block'} or a ranking row to open it</span></div>
    <div class="grid2">${card(`<div id="${mapId}" class="explore-map" style="width:100%;"></div>${legendHtml()}`, 'Map')}${card(list, 'Ranking')}</div></section>`;
}
function drawMapFor(id, rows, opt, isDistrict, onClick){
  const geoP = isDistrict ? loadGeoDistricts() : loadGeoBlocks();
  const geoKey = isDistrict ? 'district_name' : 'block_id', rowKey = isDistrict ? 'district_geo_id' : 'block_id';
  geoP.then(geo=>{
    if(!document.getElementById(id)) return;   // user moved on before the map data arrived
    const z = rows.map(r=>{ const s=opt.score(r); return s==null?3: s>=66?0: s>=33?1:2; });
    const trace = {type:'choropleth', geojson:geo, locations:rows.map(r=>r[rowKey]), z, zmin:0, zmax:3, featureidkey:'properties.'+geoKey,
      colorscale:[[0,COLORS.green],[0.333,COLORS.yellow],[0.667,COLORS.red],[1,COLORS.grey]], marker:{line:{color:'#fff', width:0.7}}, showscale:false,
      text: rows.map(r=>`<b>${esc(r.name)}</b><br>${opt.fmt(r)}`), hoverinfo:'text', customdata: rows.map((r,i)=>i)};
    const props = {}; (geo.features||[]).forEach(f=> props[f.properties[geoKey]] = f.properties);
    const lr = rows.filter(r=>props[r[rowKey]]);
    const labels = {type:'scattergeo', mode:'text', lon:lr.map(r=>props[r[rowKey]].label_lon), lat:lr.map(r=>props[r[rowKey]].label_lat),
      text: lr.map(r=>r.name), textfont:{size:lr.map(r=>props[r[rowKey]].label_size||8), color:'#2b2b2b'}, hoverinfo:'skip', showlegend:false};
    return Plotly.newPlot(id, [trace, labels], {margin:{t:0,b:0,l:0,r:0}, height:460, paper_bgcolor:'rgba(0,0,0,0)', dragmode:false,
      geo:{fitbounds:'locations', visible:false, bgcolor:'rgba(0,0,0,0)', projection:{type:'mercator'}}}, {displayModeBar:false, responsive:true, scrollZoom:false, doubleClick:false})
    .then(gd=>{ if(onClick && gd){ gd.removeAllListeners && gd.removeAllListeners('plotly_click'); gd.on('plotly_click', ev=>{ const p=ev.points[0]; if(p && p.customdata!=null) onClick(rows[p.customdata]); }); } });
  }).catch(err=>{ const el=document.getElementById(id); if(el) el.innerHTML = `<p class="disclaimer">Map failed to load (${err.message}).</p>`; });
}

// how many blocks fall in each colour band (state view)
function distBar(d, noun){
  if(!d) return '';
  const seg = (n, col)=> n ? `<span style="width:${n/d.n*100}%;background:${col}" title="${n} ${noun||'blocks'}">${n/d.n>0.08?n:''}</span>` : '';
  return `<div class="distbar">${seg(d.green,COLORS.green)}${seg(d.yellow,COLORS.yellow)}${seg(d.red,COLORS.red)}</div>
    <div class="hint" style="margin-top:6px;">${d.green} ${noun||'blocks'} score 66+ &middot; ${d.yellow} score 33–66 &middot; ${d.red} below 33</div>`;
}

function glanceCards(u){

  const rankTxt = ()=> isState ? (()=>{ const d=STATE_DATA.dist.overall; return `median block &middot; ${d.green} of ${d.n} blocks score 66+`; })()
    : SCOPE==='block' ? `${u.overall_district_rank!=null?u.overall_district_rank+ord(u.overall_district_rank):'—'} of ${u.overall_district_n} blocks in ${esc(u.district)}`
    : `${u.overall_state_rank!=null?u.overall_state_rank+ord(u.overall_state_rank):'—'} of 38 districts`;
  const d = u.dak, dakCases = d.ent.received + d.gbv.received, dakRes = d.ent.resolved + d.gbv.resolved;

  const cards = [

    {k:'vrf', lab:'VRF', v: u.vrf ? fmtPct(u.vrf.savings_discipline,0) : '—', c: u.vrf ? `of expected VRF savings made &middot; corpus ${fmtRs(u.vrf.corpus)}` : 'no VRF data', s:u.comp_scores.vrf, f:sc(u,'vrf_disc')},
    {k:'vprp', lab:'VPRP', v: fmtPct(u.vprp.coverage,0), c:`of active VOs filed a plan in ${u.vprp.year}`, s:u.comp_scores.vprp, f:sc(u,'vprp_cov')},
    {k:'nursery', lab:'Nursery', v: fmtPct(n.target_pct,0), c:`of nursery target met &middot; ${fmtNum(n.nurseries)} of ${fmtNum(n.target)}`, s:u.comp_scores.nursery, f:sc(u,'nur_target')},
    {k:'plantation', lab:'Plantation', v: fmtPct(u.plantation.survival,0), c:'of plants given in 2025-26 still alive', s:u.comp_scores.plantation, f:sc(u,'pl_surv')},
    {k:'disability', lab:'Disability SHGs', v: fmtPct(dis.target_pct,0), c:`of target met &middot; ${fmtNum(dis.pwd.n)} of ${fmtNum(dis.target)} SHGs`, s:u.comp_scores.disability, f:sc(u,'pwd_target')},

  ];

      <div class="gh"><span class="gname">${o.lab}</span>${o.none||o.idx?'':`<span class="pill ${bucket(o.s)}" title="${isState?'component score of the median block':'component score out of 100'}">score ${o.s==null?'—':fmtScore(o.s)}</span>`}</div>
      <div class="gv">${o.v}</div><div class="gc">${o.c}</div></button>`).join('')}</div>`;

// Rank, name, the 7 component scores and the SD Index. Rank always follows the
// SD Index (current weights; ties share a rank); columns sort independently.
function perfTable(rows, isDistrict, meId){
  const id = 'perf'+(++RL_ID);
  const ov = r=> rowOverall(r);
  const ranked = [...rows].filter(r=>ov(r)!=null).sort(byIndex);
  const rankOf = r=>{ const i = ranked.indexOf(r); return i<0 ? null : i+1; };
  const cols = [{key:'rank', label:'Rank', val:rankOf, asc:true},
                {key:'name', label:isDistrict?'District':'Block', val:r=>r.name, text:true},
                ...COMPS.map(c=>({key:c.key, label:c.label, val:r=>r['comp_'+c.key], num:true, comp:true})),
                {key:'overall', label:'SD Index', val:ov, num:true, idx:true}];
  window.__perf = window.__perf || {};
  window.__perf[id] = {rows, cols, sort:'rank', dir:'asc', q:'', meId, isDistrict};
  AFTER.push(()=> drawPerf(id));
  return `<div class="perf-top"><span class="hint">Scores out of 100 &middot; colour: green 66+, amber 33–66, red below 33</span>
    <input class="perf-search" id="${id}-q" type="search" placeholder="Search this table…" aria-label="Search this table"></div>
    <div class="table-wrap"><table class="perf" id="${id}"></table></div>`;
}
function drawPerf(id){
  const st = window.__perf[id]; const t = document.getElementById(id); if(!t) return;
  const col = st.cols.find(c=>c.key===st.sort);
  const rows = st.rows.filter(r=> !st.q || r.name.toLowerCase().includes(st.q)).sort((a,b)=>{
    const av=col.val(a), bv=col.val(b);
    if(av==null) return 1; if(bv==null) return -1;
    const d = col.text ? String(av).localeCompare(String(bv)) : av-bv;
    return st.dir==='asc' ? d : -d;
  });
  const cls = v=> v==null ? '' : v>=66 ? 'g' : v>=33 ? 'y' : 'r';
  const ov = r=> rowOverall(r);
  t.innerHTML = `<thead><tr>${st.cols.map(c=>`<th data-k="${c.key}" class="${c.num?'num':''}">${c.label}<span class="arrow">${st.sort===c.key?(st.dir==='asc'?' ▲':' ▼'):' ⇅'}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr class="${st.meId!=null && r.block_id===st.meId?'me':''}">${st.cols.map(c=>{
      const v = c.val(r);
      if(c.key==='rank') return `<td class="rk">${v==null?'–':v}</td>`;
      if(c.key==='name') return `<td class="nm"><a class="${cls(ov(r))}" data-slug="${r.slug}" title="SD Index ${fmtScore(ov(r))}">${esc(r.name)}</a></td>`;
      if(c.key==='secondchance' || c.key==='budget') return `<td class="num"><span class="hint">pending</span></td>`;
      return `<td class="num${c.idx?' idx':''} ${cls(v)}">${v==null?'<span class="hint">no data</span>':Math.round(v)}</td>`;
    }).join('')}</tr>`).join('')}</tbody>`;
  t.querySelectorAll('th').forEach(th=> th.addEventListener('click', ()=>{
    const k = th.dataset.k, c = st.cols.find(x=>x.key===k);
    if(st.sort===k) st.dir = st.dir==='asc' ? 'desc' : 'asc';
    else { st.sort = k; st.dir = (c.asc || c.text) ? 'asc' : 'desc'; }
    drawPerf(id);
  }));
  t.querySelectorAll('td.nm a').forEach(a=> a.addEventListener('click', ()=> st.isDistrict ? navToDistrict(a.dataset.slug) : navToBlock(a.dataset.slug)));
  const q = document.getElementById(id+'-q');
  if(q && !q.dataset.wired){ q.dataset.wired = '1'; q.addEventListener('input', e=>{ st.q = e.target.value.trim().toLowerCase(); drawPerf(id); }); }
}

// rank of this unit's component score among its peers
function compRank(comp, u){

  const me = u.comp_scores[comp]; if(me==null) return null;

function scorePanel(comp, u){

      <div style="margin-top:22px;">${card(reqVsGiven(p), 'Asked for next year vs given this year, share of all plants')}</div>`, true);
    AFTER.push(()=>{
      plot('pl-funnel', [{x:['2024-25','2025-26'], y:[q.distributed,c.distributed], name:'Distributed', type:'bar', marker:{color:'#D3D9D3'}},
        {x:['2024-25','2025-26'], y:[q.alive,c.alive], name:'Alive', type:'bar', marker:{color:'#2F9C74'}, text:[fmtPct(q.survival,0),fmtPct(c.survival,0)], textposition:'outside'}],
        {barmode:'overlay', height:240, yaxis:{tickformat:'~s'}, xaxis:{type:'category'}});
    });
    return h;
  },
  disability(u){
    const d = u.disability, p = d.pwd, r = d.regular;
    const cmp = (lab, a, b, score)=> sbar(lab, a, {text:fmtPct(a,0), sub:`regular SHGs ${fmtPct(b,0)}`});
    let h = section('Disability SHGs', `${fmtNum(d.active_vos)} active VOs &middot; target = half the VOs`, `<div class="grid2">
      ${card(tiles([tile('Disability SHGs', `${fmtNum(p.n)} / ${fmtNum(d.target)}`, `${fmtPct(d.target_pct,0)} of target`, sc(u,'pwd_target')), tile('Members', fmtNum(p.members), p.avg_members!=null?`${p.avg_members.toFixed(1)} per SHG (regular ${r.avg_members!=null?r.avg_members.toFixed(1):'—'})`:'')])
        + `<div class="subhead" style="margin-top:20px;">Formed each year</div><div id="pwd-years"></div>`)}
      ${card(pairBars([{label:'Linked to a VO', a:p.vo_pct, b:r.vo_pct}, {label:'Has a bank account', a:p.bank_pct, b:r.bank_pct}, {label:'Credit linkage (CCL or combo account)', a:p.ccl_pct, b:r.ccl_pct}]), 'Disability SHGs vs regular SHGs')}</div>`, true);
    h += section('Members with a Disability', `${fmtNum(d.dis_self)} members (${fmtPct(d.dis_pct,2)}) &middot; ${fmtNum(d.dis_family)} with the member or a family member disabled`, `<div class="grid2">
      ${card(stack([{label:'In a disability SHG', pct:d.dis_self?d.dis_in_pwd/d.dis_self*100:0},{label:'In a regular SHG', pct:d.dis_self?d.dis_in_regular/d.dis_self*100:0}], ['#2F9C74','#B7BEB7']) + `<p class="disclaimer">Shown for context, not scored.</p>`, 'Which SHG they are in')}
      ${card(switcher([{label:'Type of disability', html:vbars(d.type_mix)}, {label:'Social category', html:vbars(d.soc_mix)}]))}</div>`, true);
    const lab = {PVTG:'PVTG', TRANSGENDER:'Transgender', ELDERLY:'Elderly', OTHER:'Other special'};
    const rows = [{type:'Disability', ...p}, ...d.others.map(o=>({...o, type:lab[o.type]||o.type})), {type:'Regular', ...r}];
    h += section('Other Special SHGs', 'not scored &middot; LokOS has no member-level PVTG or transgender status', `<div class="table-wrap"><table><thead><tr><th>Type</th><th>SHGs</th><th>Linked to a VO</th><th>Bank account</th><th>Credit linkage</th><th>Members</th></tr></thead><tbody>${
      rows.map(o=>`<tr><td><b>${o.type}</b></td><td>${fmtNum(o.n)}</td><td>${fmtPct(o.vo_pct,0)}</td><td>${fmtPct(o.bank_pct,0)}</td><td>${fmtPct(o.ccl_pct,0)}</td><td>${fmtNum(o.members)}</td></tr>`).join('')}</tbody></table></div>`);
    AFTER.push(()=>{ const f=d.formed_by_year; const el=document.getElementById('pwd-years'); if(!el) return; if(!f.length){ el.innerHTML='<p class="disclaimer">No disability SHGs.</p>'; return; }
      plot('pwd-years', [{x:f.map(x=>String(x.year)), y:f.map(x=>x.n), type:'bar', marker:{color:'#2F9C74'}, hovertemplate:'%{x}: %{y} formed<extra></extra>'}], {height:190, margin:{t:4,b:30,l:40,r:8}, xaxis:{type:'category'}}); });
    return h;
  },
  budget(u){
    return section('Budget', 'district budget allocated, and how much of it was used', tiles([
      tile('Budget allocated', '<span class="awaited">Data pending</span>'), tile('Budget used', '<span class="awaited">Data pending</span>'), tile('Share used', '<span class="awaited">Data pending</span>')])
      + `<p class="disclaimer">District-level budget data will be added here when it arrives. It is not part of the SD Index until its weight is agreed.</p>`);
  },
  secondchance(u){
    const s = u.secondchance;
    return section('Programme Results', 'BBOSE Class 10 through Second Chance', tiles([
      tile('Learners enrolled', '<span class="awaited">Data awaited</span>'), tile('Sat the exam', '<span class="awaited">Data awaited</span>'), tile('Passed', '<span class="awaited">Data awaited</span>')])
      + `<p class="disclaimer">When the data arrives, the score will be enrolment coverage (enrolled ÷ target population) and pass rate (passed ÷ sat the exam).</p>`)
      + section('Target Population', 'SHG members whose schooling stopped at class 5, 7 or 8 (same definition as BBOSE_LokOS_Targets)', tiles([
      tile('Under 35', fmtNum(s.tp35)), tile('Under 30', fmtNum(s.tp30)), tile('Under 25', fmtNum(s.tp25)), tile('SC/ST, under 35', fmtNum(s.tp35_scst)), tile('OBC, under 35', fmtNum(s.tp35_obc))]));
  },
};

// ============================================================================
// DATA CHECKS tab: entries that look wrong, for follow-up with block teams.
// Built by build_sd_data.py (checks.json): "error" = cannot be right;
// "check" = far from what other places report (robust z-score > 3.5).
// ============================================================================
let CHECKS = null;
async function renderChecks(){
  const app = document.getElementById('app');
  app.innerHTML = '<p class="disclaimer">Loading checks…</p>';
  if(!CHECKS) CHECKS = await fetchJson('data/checks.json');
  if(TAB!=='checks') return;
  const compLabel = k=> (COMPS.find(c=>c.key===k)||{label:k}).label;
  // flags in the current scope
  let flags = CHECKS.flags;
  if(SCOPE==='district') flags = flags.filter(f=> f.dslug===document.getElementById('sel-district').value);
  if(SCOPE==='block') flags = flags.filter(f=> f.level==='block' && f.id===BLOCK_DATA.block_id);
  const nErr = flags.filter(f=>f.sev==='error').length, nChk = flags.length - nErr;
  const places = new Set(flags.filter(f=>f.level==='block').map(f=>f.id)).size;
  let h = `<div class="page-title"><h2 class="serif">Discrepancy Report &mdash; ${esc(scopeName())}</h2><span class="hint">entries that look wrong, to follow up with the block or district team</span></div>`;
  h += section('How Entries Are Flagged', '', `<div class="grid2">
    <div><span class="sev error">Error</span><p class="disclaimer" style="margin-top:8px;">A value that cannot be right: more plants alive than were given, a case resolved before it was filed, a sale with no plants, a VRF corpus smaller than the grant received. Flagged wherever it occurs.</p></div>
    <div><span class="sev check">Check</span><p class="disclaimer" style="margin-top:8px;">A value far from what other places report, high or low. "Far" means more than ${CHECKS.z} typical deviations from the median (a robust z-score), so a few extreme entries can't hide each other, and nothing is flagged when the data is clean. Only used for metrics where an extreme value suggests a recording problem, not good performance.</p></div></div>`);
  h += section('Summary', '', tiles([
    tile('Errors', fmtNum(nErr), 'values that cannot be right', nErr?10:90),
    tile('Checks', fmtNum(nChk), 'unusual values to confirm', nChk?50:90),
    tile('Blocks flagged', fmtNum(places), SCOPE==='block'?'this block':'with at least one flag'),
    tile('Most flags', (()=>{ const c={}; flags.forEach(f=>c[f.c]=(c[f.c]||0)+1); const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return top?esc(compLabel(top[0])):'—'; })(), 'component'),
  ]));
  if(SCOPE==='state'){
    h += section('Source-Wide Issues', 'problems with a whole data source, not one place', CHECKS.source_issues.map(s=>`<div class="issue"><span class="sev ${s.sev}">${compLabel(s.c)}</span><span class="it">${esc(s.issue)}</span><span class="id">${esc(s.detail)}</span></div>`).join(''));
    const byD = {};
    flags.forEach(f=>{ const d = byD[f.dslug] = byD[f.dslug] || {name:f.district, slug:f.dslug, error:0, check:0, comp:{}}; d[f.sev]++; d.comp[f.c]=(d.comp[f.c]||0)+1; });
    const drows = Object.values(byD).sort((a,b)=> (b.error-a.error) || (b.check-a.check));
    h += section('Flags by District', 'click a district to see its flags', `<div class="table-wrap"><table class="chk-table"><thead><tr><th>District</th><th class="num">Errors</th><th class="num">Checks</th>${SCORED_COMPS.map(c=>`<th class="num">${c.label}</th>`).join('')}</tr></thead><tbody>${
      drows.map(d=>`<tr><td class="nm"><a data-d="${d.slug}">${esc(d.name)}</a></td><td class="num"><b style="color:${d.error?'#a54632':'inherit'}">${d.error}</b></td><td class="num">${d.check}</td>${SCORED_COMPS.map(c=>`<td class="num">${d.comp[c.key]||''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
  }
  // flag list with filters
  const comps = [...new Set(flags.map(f=>f.c))];
  h += section('All Flags', `${flags.length} in ${esc(scopeName())}`, `
    <div class="chk-filters">
      <select id="chk-type" aria-label="Type"><option value="">Errors and checks</option><option value="error">Errors only</option><option value="check">Checks only</option></select>
      <select id="chk-comp" aria-label="Component"><option value="">All components</option>${comps.map(c=>`<option value="${c}">${compLabel(c)}</option>`).join('')}</select>
      <input id="chk-q" type="search" placeholder="Search place or check…" aria-label="Search flags">
      <button class="weight-btn" id="chk-dl">&#128190; Download these flags</button>
    </div><div class="table-wrap"><table class="chk-table" id="chk-tbl"></table></div>
    ${flags.length? '' : '<p class="disclaimer">No flags here.</p>'}`);
  app.innerHTML = h + footer();
  app.querySelectorAll('a[data-d]').forEach(a=> a.addEventListener('click', ()=> navToDistrict(a.dataset.d)));
  const draw = ()=>{
    const t = document.getElementById('chk-type').value, c = document.getElementById('chk-comp').value, q = document.getElementById('chk-q').value.trim().toLowerCase();
    const rows = flags.filter(f=> (!t||f.sev===t) && (!c||f.c===c) && (!q || [f.district,f.block,f.rule,f.detail].join(' ').toLowerCase().includes(q)))
      .sort((a,b)=> (a.sev===b.sev?0:a.sev==='error'?-1:1) || String(a.district).localeCompare(String(b.district)) || String(a.block||'').localeCompare(String(b.block||'')));
    window.__chkRows = rows;
    document.getElementById('chk-tbl').innerHTML = `<thead><tr><th>Type</th><th>District</th><th>Block</th><th>Component</th><th>What looks wrong</th><th>Detail</th></tr></thead><tbody>${
      rows.slice(0,600).map(f=>`<tr><td><span class="sev ${f.sev}">${f.sev==='error'?'Error':'Check'}</span></td>
        <td class="nm"><a data-d="${f.dslug}">${esc(f.district)}</a></td><td class="nm">${f.block?`<a data-b="${f.slug}">${esc(f.block)}</a>`:'<span class="hint">whole district</span>'}</td>
        <td>${esc(compLabel(f.c))}</td><td><b>${esc(f.rule)}</b></td><td class="det">${esc(f.detail)}</td></tr>`).join('')}</tbody>`
      + (rows.length>600?`<caption class="hint" style="caption-side:bottom;padding-top:8px;">Showing 600 of ${rows.length}. Narrow the filters or download to see all.</caption>`:'');
    document.querySelectorAll('#chk-tbl a[data-d]').forEach(a=> a.addEventListener('click', ()=> navToDistrict(a.dataset.d)));
    document.querySelectorAll('#chk-tbl a[data-b]').forEach(a=> a.addEventListener('click', ()=> navToBlock(a.dataset.b)));
  };
  ['chk-type','chk-comp'].forEach(id=> document.getElementById(id).addEventListener('change', draw));
  document.getElementById('chk-q').addEventListener('input', draw);
  document.getElementById('chk-dl').addEventListener('click', ()=>{
    const rows = (window.__chkRows||[]).map(f=>({Type:f.sev==='error'?'Error':'Check', District:f.district, Block:f.block||'(whole district)', Component:compLabel(f.c), 'What looks wrong':f.rule, Detail:f.detail, Value:f.value}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Flags');
    if(SCOPE==='state') XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(CHECKS.source_issues.map(s=>({Component:compLabel(s.c), Issue:s.issue, Detail:s.detail}))), 'Source-wide issues');
    XLSX.writeFile(wb, `SD_Discrepancy_Report_${scopeName().replace(/[^A-Za-z0-9]+/g,'_')}.xlsx`);
  });
  draw();
  document.querySelectorAll('.btn-open-weights').forEach(b=> b.addEventListener('click', openWeightModal));
}

// ============================================================================
// Excel export
// ============================================================================
let EXPORT_DATA=null;
async function exportToExcel(mode){
  const btn = document.getElementById('btn-export-excel'); const t = btn.innerHTML;
  btn.disabled=true; btn.innerHTML='Preparing…';
  try{
    if(!EXPORT_DATA) EXPORT_DATA = await fetchJson('data/export_data.json');
    const E = (EXPORT_DATA.periods||{})[yearKey()] || EXPORT_DATA.periods.cumulative;
    let blocks = E.blocks, districts = E.districts, tag = 'Bihar_' + (yearKey()==='cumulative' ? 'Cumulative' : yearKey());
    if(mode==='view' && SCOPE==='district'){ blocks = blocks.filter(r=>r.district===DISTRICT_DATA.name); districts = districts.filter(r=>r.name===DISTRICT_DATA.name); tag = DISTRICT_DATA.name; }
    if(mode==='view' && SCOPE==='block'){ blocks = blocks.filter(r=>r.block_id===BLOCK_DATA.block_id); districts = districts.filter(r=>r.name===DISTRICT_DATA.name); tag = DISTRICT_DATA.name+'_'+BLOCK_DATA.name; }
    const defs = META.kpis.map(k=>({Component: COMPS.find(c=>c.key===k.component).label, Metric:k.label, 'Scored as': k.type==='target'?'% of target':'percentile', Definition:k.desc}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(blocks), 'Blocks');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(districts), 'Districts');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(defs), 'Metric definitions');
    XLSX.writeFile(wb, `SD_Tracker_${tag.replace(/[^A-Za-z0-9]+/g,'_')}.xlsx`);
    btn.innerHTML=t;
  } catch(err){ btn.innerHTML='Export failed'; setTimeout(()=>{btn.innerHTML=t;},2500); }
  btn.disabled=false;
}

init().catch(err=>{
  document.getElementById('app').innerHTML = `<div class="note">The tracker could not load its data: ${esc(err.message)}. Keep index.html next to its <b>data</b> folder; if files were moved, re-run build_sd_data.py.</div>`;
});
</script>
